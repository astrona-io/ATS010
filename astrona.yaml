        difficulty: advanced
        estimated_duration: 40m
        topic: policy-types
        task_kind: build
        tags: [kyverno, generate, cleanup, synchronize, clone, rbac, background-controller]
        learning_goals:
          - Give the background and cleanup controllers the RBAC they need through aggregated ClusterRoles
          - Generate a quota, a network policy and a cloned ConfigMap for labelled namespaces
          - Delete expired ConfigMaps on a schedule with a ClusterCleanupPolicy
        resources:
          - name: "Kyverno generate rules"
            url: https://kyverno.io/docs/policy-types/cluster-policy/generate/
          - name: "Kyverno cleanup policies"
            url: https://kyverno.io/docs/policy-types/cleanup-policy/

