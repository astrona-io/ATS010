        title: "Validate And Mutate Policies Lab"
        path: sections/section-040/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 30m
        topic: policy-types
        task_kind: build
        tags: [kyverno, mutate, validate, patchStrategicMerge, patchesJson6902, deny, pattern]
        learning_goals:
          - Add default labels and a securityContext default with a merge patch and a JSON patch
          - Reject pods without an owner label or with a latest image tag
          - Deny the deletion of protected ConfigMaps with a deny rule on request.oldObject
        resources:
          - name: "Kyverno mutate rules"
            url: https://kyverno.io/docs/policy-types/cluster-policy/mutate/
          - name: "Kyverno validate rules"
