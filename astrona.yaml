      - type: lab
        title: "Applying Policy in Cluster Capstone Lab"
        path: sections/section-010/capstone/labs/lab-01

  - id: module-020
    title: "Section 020: Resource Selection"
    description: >
      Go deep on the match/exclude block that decides which resources a
      Kyverno rule ever sees: selecting by kind, name, and wildcard;
      scoping by namespace and namespaceSelector; filtering by object
      labels and admission operation; and selecting by caller identity
      with subjects, roles, and clusterRoles, combined with any/all
      logic.

    content:
