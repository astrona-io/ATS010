  - id: module-040
    title: "Section 040: Applying Policy Types"
    description: >
      Apply the four everyday Kyverno policy types: mutate rules with
      patchStrategicMerge and patchesJson6902, validate rules with pattern
      and deny, generate rules with synchronize and clone, and cleanup
      policies, plus a reading on image verification with verifyImages.
      The section closes with a capstone that combines them.

    content:
