        learning_goals:
          - Combine name, namespace label, resource label and operation filters in one match block
          - Add a subjects-based exclude and keep background false
          - Prove each axis independently takes a resource out of scope
        resources:
          - name: "Kyverno match and exclude"
            url: https://kyverno.io/docs/writing-policies/match-exclude/
          - name: "Kyverno validate rules"
