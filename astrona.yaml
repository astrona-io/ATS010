training:
  id: ATS010
  title: "KCA: Applying Policies"
  description: >
    Training material covering the Applying Policies domain for the
    Kyverno Certified Associate (KCA) learning path, with hands-on labs
    for each competency running on a kind Kubernetes cluster.

  certification:
    name: Kyverno Certified Associate
    code: KCA
    provider: Kyverno Project (CNCF Sandbox)
    domain: Applying Policies
    weight: 100

modules:
  - id: module-010
    title: "Section 010: Applying Policy in Cluster"
    description: >
      Move from a written policy manifest to a policy that is actually
      live in the cluster: applying ClusterPolicy and Policy objects with
      kubectl, the difference between what Enforce blocks at admission
      time and what Audit only records, inspecting policy status and
      reports, background scanning already-existing resources, autogen
      rules for Pod controllers, and PolicyExceptions as a scoped,
      auditable override.

    content:
      - type: reading
        title: "Section Overview"
        path: sections/section-010/README.md
      - type: reading
        title: "Getting a Policy Live: ClusterPolicy vs Policy & the Admission Path"
        path: sections/section-010/module-01/course.md
      - type: reading
        title: "Applying ClusterPolicy & Policy with kubectl"
        path: sections/section-010/module-01/course-01-applying-clusterpolicy-and-policy-with-kubectl.md
      - type: reading
        title: "Enforce vs Audit at Apply Time"
        path: sections/section-010/module-01/course-02-enforce-vs-audit-at-apply-time.md
      - type: reading
        title: "Inspecting Policy Status, Reports and Events"
        path: sections/section-010/module-01/course-03-inspecting-policy-status-reports-and-events.md
      - type: reading
        title: "Question"
        path: sections/section-010/module-01/labs/lab-01/question.md
      - type: lab
        title: "Enforce-Mode Resource Limits Policy Lab"
        path: sections/section-010/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 20m
        topic: policy-application
        task_kind: build
        tags: [kyverno, clusterpolicy, audit, enforce, policyreport, dry-run]
        learning_goals:
          - Apply a ClusterPolicy in Audit mode and read the violation in a PolicyReport
          - Switch the same policy to Enforce and see a violating Pod blocked while a compliant Pod is admitted
          - Check that a policy is Ready before relying on it
        resources:
          - name: "Kyverno validate rules"
            url: https://kyverno.io/docs/policy-types/cluster-policy/validate/
          - name: "Kyverno policy reports"
            url: https://kyverno.io/docs/policy-reports/
      - type: reading
        title: "Summary"
        path: sections/section-010/module-01/course-04-summary.md
      - type: reading
        title: "Applying Beyond Admission: Background Scans, Autogen & Exceptions"
        path: sections/section-010/module-02/course.md
      - type: reading
        title: "Background Scanning Already-Existing Resources"
        path: sections/section-010/module-02/course-01-background-scanning-already-existing-resources.md
      - type: reading
        title: "Autogen for Pod Controllers"
        path: sections/section-010/module-02/course-02-autogen-for-pod-controllers.md
      - type: reading
        title: "PolicyExceptions in Depth"
        path: sections/section-010/module-02/course-03-policyexceptions-in-depth.md
      - type: reading
        title: "Question"
        path: sections/section-010/module-02/labs/lab-01/question.md
      - type: lab
        title: "Background Scan & PolicyException Lab"
        path: sections/section-010/module-02/labs/lab-01
        difficulty: intermediate
        estimated_duration: 30m
        topic: policy-application
        task_kind: build
        tags: [kyverno, background-scan, autogen, policyexception, policyreport]
        learning_goals:
          - Confirm autogen rules and a background scan report for a pre-existing Deployment
          - Show that a new non-compliant Deployment is blocked at admission
          - Enable PolicyExceptions and exempt one legacy Deployment with a narrow exception
        resources:
          - name: "Kyverno autogen rules"
            url: https://kyverno.io/docs/policy-types/cluster-policy/autogen/
          - name: "Kyverno PolicyExceptions"
            url: https://kyverno.io/docs/policy-exceptions/
      - type: reading
        title: "Summary"
        path: sections/section-010/module-02/course-04-summary.md
      - type: reading
        title: "Question"
        path: sections/section-010/capstone/labs/lab-01/question.md
      - type: lab
        title: "Applying Policy in Cluster Capstone Lab"
        path: sections/section-010/capstone/labs/lab-01
        difficulty: advanced
        estimated_duration: 30m
        topic: policy-application
        task_kind: integrate
        tags: [kyverno, enforce, audit, background-scan, policyexception, autogen]
        learning_goals:
          - Enforce a rule in one namespace and audit it in another from two separate policies
          - Confirm a legacy Deployment is reported but left untouched
          - Admit a migration Job through a PolicyException that names the autogen rule
        resources:
          - name: "Kyverno PolicyExceptions"
            url: https://kyverno.io/docs/policy-exceptions/
          - name: "Kyverno policy reports"
            url: https://kyverno.io/docs/policy-reports/
      - type: quiz
        title: "Section 010 Knowledge Check: Applying Policy in Cluster"
        path: sections/section-010/quiz.yaml
        pass_score: 70

  - id: module-020
    title: "Resource Selection"
    description: >
      Control exactly which resources a Kyverno rule sees: kinds, names and
      wildcards, namespaces and namespaceSelector, annotations, exclude
      precedence, selector and operations, and requester identity with
      subjects, roles and clusterRoles. Each module pairs a layered reader
      with an ungraded playground and a graded lab, and the section closes
      with an integration capstone.
    content:
      - type: reading
        title: "Section 020: Resource Selection"
        path: sections/section-020/README.md
      - type: reading
        title: "match/exclude Fundamentals: Kinds, Names & Namespaces"
        path: sections/section-020/module-01/course.md
      - type: reading
        title: "Selecting by Kind, Name & Wildcards"
        path: sections/section-020/module-01/course-01-selecting-by-kind-name-and-wildcards.md
      - type: reading
        title: "Namespaces & namespaceSelector"
        path: sections/section-020/module-01/course-02-namespaces-and-namespaceselector.md
      - type: reading
        title: "Annotations, Exclude Precedence & Policy Scope"
        path: sections/section-020/module-01/course-03-annotations-exclude-precedence-and-policy-scope.md
      - type: reading
        title: "Question"
        path: sections/section-020/module-01/labs/lab-01/question.md
      - type: lab
        title: "Scope a Rule by Kind, Name and Namespace Label Lab"
        path: sections/section-020/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 25m
        topic: policy-scope
        task_kind: build
        tags: [kyverno, match, exclude, names, wildcards, namespaceSelector, ingress]
        learning_goals:
          - Write a ClusterPolicy that matches Ingresses by name pattern in namespaces labeled env=prod
          - Prove the rule blocks in scope, admits out of scope and follows namespace relabeling
          - Explain why a name or label change takes a resource out of scope
        resources:
          - name: "Kyverno match and exclude"
            url: https://kyverno.io/docs/writing-policies/match-exclude/
          - name: "Kyverno validate rules"
            url: https://kyverno.io/docs/writing-policies/validate/
      - type: reading
        title: "Summary"
        path: sections/section-020/module-01/course-04-summary.md
      - type: reading
        title: "Selecting by Identity & Operation"
        path: sections/section-020/module-02/course.md
      - type: reading
        title: "selector & Operations"
        path: sections/section-020/module-02/course-01-selector-and-operations.md
      - type: reading
        title: "subjects, roles, clusterRoles & any/all"
        path: sections/section-020/module-02/course-02-subjects-roles-clusterroles-and-any-all.md
      - type: reading
        title: "Debugging Why a Rule Did or Did Not Match"
        path: sections/section-020/module-02/course-03-debugging-why-a-rule-did-or-did-not-match.md
      - type: reading
        title: "Question"
        path: sections/section-020/module-02/labs/lab-01/question.md
      - type: lab
        title: "Select by Labels and Exempt a CI Identity Lab"
        path: sections/section-020/module-02/labs/lab-01
        difficulty: intermediate
        estimated_duration: 25m
        topic: policy-scope
        task_kind: build
        tags: [kyverno, selector, operations, subjects, exclude, impersonation, background]
        learning_goals:
          - Scope a rule to frontend Pods with selector and operations
          - Exclude a CI ServiceAccount with a subjects-based exclude and background false
          - Prove the exclusion with kubectl --as impersonation and server-side dry-run
        resources:
          - name: "Kyverno match and exclude"
            url: https://kyverno.io/docs/writing-policies/match-exclude/
          - name: "Kubernetes user impersonation"
