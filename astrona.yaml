      - type: reading
        title: Question
        path: sections/section-030/module-02/labs/lab-01/question.md
      - type: lab
        title: "Rule-Level Settings Lab"
        path: sections/section-030/module-02/labs/lab-01
        difficulty: intermediate
        estimated_duration: 25m
        topic: policy-settings
        task_kind: build
        tags: [kyverno, generateexisting, applyrules, generate, mutate, networkpolicy, background-controller]
        learning_goals:
          - Backfill a default-deny NetworkPolicy into namespaces that existed before the policy with generateExisting
          - Prove forward generation still works for a namespace created later
          - Use applyRules One with ordered mutate rules so each namespace gets exactly one cost-center label
