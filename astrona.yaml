  - id: module-030
    title: "Common Policy Settings"
    description: >
      Master the policy-level and rule-level settings that decide how a
      Kyverno policy behaves once it is live: failurePolicy and
      webhookTimeoutSeconds for webhook resilience, schemaValidation,
      background and admission scope, validationFailureAction and
      emitWarning at the policy level, and rule-level controls such as
      applyRules, generateExisting, and mutateExistingOnPolicyUpdate,
      including how to backfill existing resources safely.

    content:
      - type: reading
        title: Section Overview
        path: sections/section-030/README.md

      - type: reading
        title: "Policy-Level Settings: failurePolicy, Timeouts & Schema Validation"
        path: sections/section-030/module-01/course.md
