        path: sections/section-030/module-01/course-02-schemavalidation-and-policy-wide-background.md
      - type: reading
        title: "admission, validationFailureAction & emitWarning"
        path: sections/section-030/module-01/course-03-admission-validationfailureaction-and-emitwarning.md
      - type: reading
        title: Question
        path: sections/section-030/module-01/labs/lab-01/question.md
      - type: lab
        title: "failurePolicy & Timeout Tuning Lab"
        path: sections/section-030/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 20m
        topic: policy-settings
        task_kind: build
        tags: [kyverno, failurepolicy, webhooktimeoutseconds, enforce, admission-webhook, clusterpolicy]
        learning_goals:
          - Write two ClusterPolicies that differ only in failurePolicy (Fail and Ignore) with webhookTimeoutSeconds 5
          - Prove both policies enforce the same label rule while Kyverno is healthy
          - Leave the Kyverno admission controller healthy after an outage experiment
