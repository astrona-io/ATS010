  - id: module-030
    title: "Section 030: Common Policy Settings for Kyverno Rules"
    description: >
      Master the policy-level and rule-level settings that decide how a
      Kyverno policy behaves once it is live: failurePolicy and
      webhookTimeoutSeconds for webhook resilience, schemaValidation and
      background scanning at the policy level, and rule-level controls
      such as applyRules, generateExisting, and
      mutateExistingOnPolicyUpdate.

