apiVersion: apps/v1
kind: Deployment
metadata:
  name: new-worker
  namespace: background-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: new-worker
  template:
    metadata:
      labels:
        app: new-worker
    spec:
      containers:
        - name: new-worker
          image: nginx:alpine
