apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits-bg
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-resource-limits-bg
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - background-ns
      validate:
        message: "Every container must set resources.limits.cpu and resources.limits.memory."
        pattern:
          spec:
            containers:
              - resources:
                  limits:
                    cpu: "?*"
                    memory: "?*"
