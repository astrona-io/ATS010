# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Applying Beyond Admission (PLAYGROUND) - playground environment.
# A clean sandbox: it starts, installs Kyverno 1.13.2 and seeds a namespace
# with two non-compliant Deployments, then stays running for free exploration.
# No task, no grading, no `astrona submit`.
apiVersion: astrona.io/v1
metadata:
  name: ats-010-playground-010-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - nginx:alpine
      - busybox:1.36

# What the learner starts with: Kyverno v1.13.2 with its webhooks ready and the
# namespace `background-ns` holding the Deployments `legacy-worker` and
# `report-worker`, both without resource limits, on purpose. No policy and no
# PolicyException exist, and PolicyException support is not enabled.
bootstrap:
  init:
    - name: prepare
      description: "Install Kyverno v1.13.2, wait for its controllers and webhooks, then seed background-ns"
      type: file
      source: bootstrap/prepare.sh

teardown:
  keepCluster: false
