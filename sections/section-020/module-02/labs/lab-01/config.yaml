# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Identity-Based Resource Selection (LAB). Graded against the live cluster.
# UNTESTED - built from static checks only; not yet booted.
apiVersion: astrona.io/v1
metadata:
  name: "ats-010-lab-005"
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8

# Starting state: Kyverno v1.13.2, namespace apps-ns, and the ci-deployer
# ServiceAccount with RBAC to create Pods there. No policy.
bootstrap:
  init:
    - name: "install-kyverno"
      description: "Installs Kyverno v1.13.2 onto the kind cluster"
      type: "file"
      source: "bootstrap/01-install-kyverno.sh"
    - name: "lab-005-setup"
      description: "Creates the apps-ns namespace and the ci-deployer ServiceAccount with RBAC to create Pods"
      type: "file"
      source: "bootstrap/02-seed-namespace-and-serviceaccount.sh"

# Applied only by `astrona test`: the reference solution and the exercise Pods.
testing:
  init:
    - name: "apply-solution"
      description: "Apply the reference ClusterPolicy"
      type: "file"
      source: "solution/apply.sh"
    - name: "create-exercise-objects"
      description: "Wait for enforcement, then create ci-pod and backend-pod"
      type: "file"
      source: "testing/create-exercise-objects.sh"

validation:
  scripts:
    - name: "policy-defined"
      description: "The ClusterPolicy exists, is Enforce, and uses selector, operations CREATE, a ci-deployer exclude and background: false"
      type: "file"
      source: "validation/validate-policy-defined.sh"
      hint: "The Kyverno field for labels on the Pod itself is selector (not objectSelector). Identity-based policies need spec.background: false. Put the exclude under exclude.any with a subjects entry of kind ServiceAccount."
    - name: "frontend-blocked"
      description: "A tier=frontend Pod with a bad image is rejected; registry.internal/* is admitted"
      type: "file"
      source: "validation/validate-frontend-blocked.sh"
      hint: "The validate pattern is spec.containers[].image: \"registry.internal/*\". Kyverno needs a few seconds after apply; try again."
    - name: "ci-deployer-excluded"
      description: "The ci-deployer ServiceAccount bypasses the rule"
      type: "file"
      source: "validation/validate-ci-deployer-excluded.sh"
      hint: "subjects needs kind: ServiceAccount, name: ci-deployer and namespace: apps-ns. The exclude block lives next to match, not inside it."
    - name: "out-of-scope-admitted"
      description: "tier=backend Pods and UPDATE requests are out of scope"
      type: "file"
      source: "validation/validate-out-of-scope-admitted.sh"
      hint: "selector.matchLabels must be tier: frontend. If relabeling backend-pod is rejected, you included UPDATE; the question asks for operations: [CREATE] only."
    - name: "exercise-objects"
      description: "frontend-pod is absent; ci-pod and backend-pod exist"
      type: "file"
      source: "validation/validate-exercise-objects.sh"
      hint: "Create ci-pod while impersonating ci-deployer (kubectl --as=system:serviceaccount:apps-ns:ci-deployer) and backend-pod as yourself."

teardown:
  keepCluster: false
