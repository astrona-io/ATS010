# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Test Policies With kyverno test (PLAYGROUND) - playground environment. A clean sandbox: it starts,
# installs Kyverno v1.13.2 and the Kyverno CLI v1.13.2, creates the working
# directory $HOME/kyverno-lab/m2, then stays running for free exploration.
# No task, no grading, no `astrona submit`.
apiVersion: astrona.io/v1
metadata:
  name: ats-010-playground-060-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8

bootstrap:
  init:
    - name: install-kyverno
      description: "Install Kyverno v1.13.2 and wait for its four controllers"
      type: file
      source: bootstrap/01-install-kyverno.sh
    - name: install-kyverno-cli
      description: "Download and install the Kyverno CLI v1.13.2"
      type: file
      source: bootstrap/02-install-kyverno-cli.sh
    - name: seed-working-directory
      description: "Create $HOME/kyverno-lab/m2 with two policies, three Pod manifests and test directories"
      type: file
      source: bootstrap/03-seed-working-directory.sh

teardown:
  keepCluster: false
